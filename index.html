<!doctype html>
<html lang="pt-BR" data-persona="guitarrista">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#6410c9" />
    <script>
      (() => {
        try {
          const selected = localStorage.getItem('joaquim:persona:v1');
          const colors = { guitarrista: '#6410c9', boxeador: '#f6c934', tenista: '#165a40' };
          if (Object.prototype.hasOwnProperty.call(colors, selected)) {
            document.documentElement.dataset.persona = selected;
            document.querySelector('meta[name="theme-color"]').content = colors[selected];
          }
        } catch { /* Default world remains available if storage is blocked. */ }
      })();
    </script>
    <style>html{background:#6410c9;color:#fff6e2}html[data-persona="boxeador"]{background:#f6c934;color:#192957}html[data-persona="tenista"]{background:#165a40;color:#f4f7ee}</style>
    <meta name="description" content="Portfólio de Joaquim Moura. Engenharia de Software na FIAP, 2026–2029. Projetos de desenvolvimento de software e front-end." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <title>Joaquim Moura — Portfólio</title>
    <meta property="og:title" content="Joaquim Moura — Portfólio" />
    <meta property="og:description" content="Engenharia de Software — FIAP. Desenvolvimento de software e front-end." />
    <meta property="og:image" content="/og-cover.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Definir canonical e URLs OG absolutas quando o domínio de publicação for escolhido. -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>Este portfólio precisa de JavaScript para exibir os projetos. Você também pode conhecer meu trabalho em <a href="https://github.com/JoaquimGSM">github.com/JoaquimGSM</a>.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
