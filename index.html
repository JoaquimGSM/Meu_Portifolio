<!doctype html>
<html lang="pt-BR" data-persona="guitarrista">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#21132F" />
    <script>
      (() => {
        try {
          const selected = localStorage.getItem('joaquim:persona:v1');
          const colors = { guitarrista: '#21132f', boxeador: '#ead9f3', tenista: '#123c2d' };
          if (Object.prototype.hasOwnProperty.call(colors, selected)) {
            document.documentElement.dataset.persona = selected;
            document.querySelector('meta[name="theme-color"]').content = colors[selected];
          }
        } catch { /* Default world remains available if storage is blocked. */ }
      })();
    </script>
    <style>html{background:#21132f;color:#f4edf8}html[data-persona="boxeador"]{background:#ead9f3;color:#274c9b}html[data-persona="tenista"]{background:#123c2d;color:#f4f7ee}</style>
    <meta name="description" content="Três versões de Joaquim Moura: guitarra, boxe e tênis. Um arquivo pessoal de projetos e experiências digitais. Engenharia de Software na FIAP." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <title>Joaquim Moura — Três versões de mim</title>
    <meta property="og:title" content="Joaquim Moura — Três versões de mim" />
    <meta property="og:description" content="Guitarra, boxe, tênis e um arquivo pessoal de projetos digitais." />
    <meta property="og:image" content="/og-cover.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- Definir canonical e URLs OG absolutas quando o domínio de publicação for escolhido. -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>Este portfólio precisa de JavaScript para exibir os projetos. Você também pode conhecer meu trabalho em <a href="https://github.com/JoaquimGSM">github.com/JoaquimGSM</a>.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
